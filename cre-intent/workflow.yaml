# CRE workflow config: cre-intent
# Target names are used with: cre workflow simulate cre-intent --target staging-settings

staging-settings:
  user-workflow:
    workflow-name: "cre-intent-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "cre-intent-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
