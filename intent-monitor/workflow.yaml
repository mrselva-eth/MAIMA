# CRE workflow config: intent-monitor
# Target names are used with: cre workflow simulate intent-monitor --target staging-settings

staging-settings:
  user-workflow:
    workflow-name: "intent-monitor-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "intent-monitor-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
