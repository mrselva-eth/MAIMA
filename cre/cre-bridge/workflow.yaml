# CRE workflow: bridge (separate folder)
# Simulate: cre workflow simulate cre-bridge --target staging-settings

staging-settings:
  user-workflow:
    workflow-name: "bridge-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "bridge-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
